<meta charset="utf-8">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: compact PR header, then a pannable graph of the PR's code units in left-to-right lanes, under an overlay review drawer, with an in-browser full view. Single dark look. Everything below the style is driven by the JSON in #review-data (scripts/build.rb). */
:root {
  color-scheme: dark;
  --bg: #0F1115;
  --canvas: #0B0D10;
  --dot: #262B34;
  --head: #12151A;
  --panel: #13161B;
  --surface: #181C22;
  --surface-2: #15181E;
  --hover: #1C2129;
  --line: #252A33;
  --line-2: #232831;
  --text: #E6E8EC;
  --text-2: #C9CED6;
  --text-3: #B7BDC7;
  --muted: #9AA1AD;
  --faint: #8B93A1;
  --accent: #8AB4F8;
  --accent-soft: #1A2233;
  --code-bg: #0E1014;
  --add-bg: #11281C; --add-fg: #BDEDD3; --add: #5FD39B;
  --del-bg: #2B1616; --del-fg: #F5C4BE; --del: #F5877C;
  --hunk-bg: #151B26; --hunk-fg: #8FA6C8;
  --sev-high: #F5877C; --sev-high-bg: #3A1C1A;
  --sev-med: #F0A35E; --sev-med-bg: #3A2614;
  --sev-low: #8FB4EA; --sev-low-bg: #18263A;
  --sev-nit: #A0A7B4; --sev-nit-bg: #232831;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { color: #B3CDFB; text-decoration: underline; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--mono); }

.app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
header.pr { flex: none; background: var(--head); border-bottom: 1px solid var(--line-2); }
.pr-bar { display: flex; align-items: center; gap: 6px 12px; min-height: 42px; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); flex-wrap: wrap; }
.pr-id { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 420px; }
.repo { font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pr-id h1 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pr-id h1 .num { color: var(--faint); font-weight: 400; }
.pr-id h1 a.pr-link { color: var(--text); }
.pr-id h1 a.pr-link:hover { color: #B3CDFB; text-decoration: underline; }
.pill-state { flex: none; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #173325; color: #7BDCAB; }
.pill-state.merged { background: #2A2148; color: #BCA8FF; }
.pill-state.closed { background: #3A1C1A; color: #F5877C; }
.merge-line { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.merge-line code { color: var(--text-2); background: #1C2028; padding: 1px 5px; border-radius: 4px; font-size: 11px; }
nav.tabs { display: flex; gap: 2px; align-items: center; }
nav.tabs a, nav.tabs span { padding: 5px 9px; border-radius: 6px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
nav.tabs a:hover { color: var(--text); background: var(--hover); text-decoration: none; }
nav.tabs .count { color: var(--faint); }
nav.tabs [aria-current] { color: var(--text); font-weight: 600; background: var(--accent-soft); box-shadow: inset 0 -2px 0 var(--accent); }
.pr-meta { display: flex; align-items: center; gap: 14px; font-size: 12px; white-space: nowrap; }
.pr-meta .adds { font-family: var(--mono); }
.plus { color: var(--add); } .minus { color: var(--del); }
.progress { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.bar { width: 90px; height: 5px; background: var(--line-2); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
@media (max-width: 1100px) { .merge-line { display: none; } }
@media (max-width: 700px) { .pr-meta .adds, nav.tabs a { display: none; } }

.main { flex: 1; min-height: 0; position: relative; overflow: hidden; overflow: clip; --drawer-w: min(720px, 100%); --dw: 0px; }
.main.drawer-open { --dw: var(--drawer-w); }
.app.full header.pr { display: none; }
.app.full .main { position: fixed; inset: 0; z-index: 40; }
section.canvas { position: absolute; inset: 0; overflow: hidden; }
.viewport { position: absolute; inset: 0; touch-action: none; user-select: none; cursor: grab; background-color: var(--canvas); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); }
.viewport.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.world.animate { transition: transform .35s ease; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges path { transition: opacity .2s; }
.lane-head { position: absolute; width: 232px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: #6E7684; border-top: 1px solid #262B34; padding-top: 8px; display: flex; justify-content: space-between; gap: 8px; }
.lane-head span:last-child { font-family: var(--mono); font-weight: 500; letter-spacing: 0; text-transform: none; color: #59606C; }
.boundary { position: absolute; width: 1px; background: repeating-linear-gradient(to bottom, #3B5F94 0 6px, transparent 6px 12px); opacity: .55; }
.boundary-label { position: absolute; font-size: 10.5px; color: #6F8FC0; white-space: nowrap; transform: translateX(-50%); background: var(--canvas); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); }

.gnode { position: absolute; width: 232px; height: 120px; box-sizing: border-box; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; text-align: left; border-radius: 10px; border-width: 1.5px; border-style: solid; cursor: pointer; overflow: hidden; transition: opacity .2s, box-shadow .15s, border-color .15s; }
.gnode:hover { outline: 2px solid rgba(230,232,236,0.16); outline-offset: 3px; }
.gnode:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.gnode .row1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.gnode .stats { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; flex: none; }
.fpill { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 4px; line-height: 1.35; }
.gnode .sub { display: block; font-size: 10.5px; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gnode .name { display: block; font-family: var(--mono); font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gnode .bul { display: block; font-size: 11.3px; line-height: 1.35; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gnode .thumb-dot { position: absolute; right: 9px; bottom: 8px; width: 16px; height: 12px; border-radius: 2px; border: 1.4px solid #6E7684; opacity: .85; }
.gnode .thumb-dot::after { content: ""; position: absolute; left: 3px; bottom: 2px; width: 8px; height: 4px; border-left: 1.4px solid #6E7684; border-bottom: 1.4px solid #6E7684; transform: skewX(-20deg); }
.gnode.reviewed { filter: saturate(.15); }
.gnode.untouched .name { color: #B7BDC7 !important; font-weight: 500; }
.gnode.untouched .bul { color: #8B93A1; }
.gnode.untouched:hover, .gnode.untouched:focus-visible { opacity: 1 !important; }
.gnode.reviewed:hover, .gnode.reviewed:focus-visible { opacity: .95 !important; filter: none; }
.rv-badge { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #8AB4F8; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px #0B0D10, 0 4px 12px rgba(0,0,0,.55); transform: scale(var(--bs, 1)); pointer-events: none; transition: opacity .2s; }
.rv-badge svg, .rv-mini svg { fill: none; stroke: #0F1115; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.rv-mini { width: 13px; height: 13px; border-radius: 50%; background: #8AB4F8; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.elabel { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 10.8px; font-weight: 500; line-height: 1; padding: 5px 8px; border-radius: 999px; background: var(--bg); border: 1px solid #2E333D; cursor: pointer; transition: opacity .2s; font-family: var(--sans); }
.elabel:hover { filter: brightness(1.25); }

.toolbar { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(14px, env(safe-area-inset-left, 0px)); right: calc(14px + var(--dw)); transition: right .22s ease; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.toolbar > .spacer { flex: 1; pointer-events: none; }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border: 1px solid #262A33; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.35); flex-wrap: wrap; }
.seg button { border: none; border-radius: 6px; padding: 7px 11px; font-size: 12.5px; font-weight: 500; cursor: pointer; background: transparent; color: #A0A7B4; display: flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: #2A303B; color: #F2F3F5; }
.seg button:hover { color: var(--text); }
.seg .sw { width: 18px; height: 6px; }
.tool-btn { display: flex; align-items: center; gap: 7px; padding: 8px 11px; font-size: 12.5px; background: var(--surface-2); border: 1px solid #262A33; border-radius: 8px; cursor: pointer; color: var(--text-2); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.tool-btn:hover { background: #232833; }
.tool-btn.panel-btn { color: var(--text); }
.tool-btn.panel-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: #2E3D5C; color: var(--accent); }
.tool-btn .count-pill { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: var(--sev-med-bg); color: var(--sev-med); }
.box { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #5A6170; display: inline-flex; align-items: center; justify-content: center; }
.tool-btn[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.tool-btn[aria-pressed="true"] .box::after { content: ""; width: 7px; height: 4px; border-left: 2px solid #0F1115; border-bottom: 2px solid #0F1115; transform: rotate(-45deg) translate(1px, -1px); }
.mode-note { font-size: 12px; color: var(--text-2); background: var(--accent-soft); border: 1px solid #2E3D5C; padding: 7px 11px; border-radius: 8px; max-width: 520px; }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 4px; border-radius: 3px; border: 1px solid #3A404B; color: var(--text-2); background: #1C2028; }

.legend { position: absolute; left: 14px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; background: rgba(21,24,30,.95); border: 1px solid #262A33; border-radius: 10px; font-size: 11.5px; color: var(--text-3); box-shadow: 0 6px 18px rgba(0,0,0,.35); max-width: 430px; }
.legend h4 { margin: 0; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.legend .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 14px; }
.legend .grid span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.sq { width: 12px; height: 12px; border-radius: 3px; border-width: 1.5px; border-style: solid; flex: none; }
.main.drawer-open .legend { bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 56px); }
.zoombar { position: absolute; right: calc(max(14px, env(safe-area-inset-right, 0px)) + var(--dw)); transition: right .22s ease; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
.zoombar .hint { font-size: 11.5px; color: var(--faint); background: rgba(11,13,16,.85); padding: 4px 8px; border-radius: 6px; }
.main.drawer-open .zoombar .hint { display: none; }
.zoombar .seg { pointer-events: auto; align-items: center; }
.zoombar .seg button { min-width: 34px; height: 32px; justify-content: center; padding: 0 9px; color: var(--text-2); }
.zoombar .seg button:hover { background: #232833; }
.zoombar .sep { width: 1px; height: 20px; background: #2C313A; margin: 0 3px; }

aside.rail { position: absolute; top: 0; right: 0; bottom: 0; width: var(--drawer-w); z-index: 20; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: -24px 0 48px rgba(0,0,0,.5); transform: translateX(104%); visibility: hidden; transition: transform .22s ease, visibility 0s linear .22s; }
.main.drawer-open aside.rail { transform: none; visibility: visible; transition: transform .22s ease, visibility 0s; }
.rail-top { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px max(18px, env(safe-area-inset-right, 0px)) 9px 24px; border-bottom: 1px solid var(--line-2); background: #15181E; }
.rail-top .ttl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-top .acts { display: flex; gap: 6px; flex: none; }
.icon-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; background: transparent; border: 1px solid #262A33; border-radius: 7px; cursor: pointer; font-size: 12px; color: var(--text-2); }
.icon-btn:hover { background: var(--hover); }
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.rail-inner { padding: 20px max(28px, env(safe-area-inset-right, 0px)) 44px 28px; display: flex; flex-direction: column; gap: 22px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0; }
.rail p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-2); text-wrap: pretty; }
.rail h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text); }
.rail h3 { margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack-strip { display: flex; flex-wrap: wrap; gap: 4px; }
.stack-strip a, .stack-strip span { font-family: var(--mono); font-size: 11.5px; padding: 4px 7px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.stack-strip .here { background: var(--accent-soft); border-color: #2E3D5C; color: var(--text); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: flex; flex-direction: column; gap: 6px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { display: flex; gap: 12px; font-family: var(--mono); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.row-btn { display: flex; gap: 11px; align-items: flex-start; text-align: left; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; width: 100%; }
.row-btn:hover { background: var(--hover); }
.sev { flex: none; min-width: 30px; height: 22px; border-radius: 5px; font-family: var(--mono); font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 5px; }
.f-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.f-title { font-size: 13px; font-weight: 600; color: var(--text); }
.f-target { font-family: var(--mono); font-size: 11.5px; }
.f-text { font-size: 12.5px; line-height: 1.5; color: #AEB4BF; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.list button { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface-2); border: none; border-bottom: 1px solid #20242C; text-align: left; cursor: pointer; width: 100%; }
.list button:last-child { border-bottom: none; }
.list button:hover { background: var(--hover); }
.list button.done .li-main { opacity: .5; }
.glyph { flex: none; width: 20px; height: 20px; border-radius: 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
.li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.li-main .q { font-family: var(--mono); font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li-main .s { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.check { flex: none; width: 15px; height: 15px; }
.back { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 6px; background: transparent; border: 1px solid #262A33; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--text-2); }
.back:hover { background: var(--hover); }
.nd-head { display: flex; flex-direction: column; gap: 8px; }
.nd-name { margin: 2px 0 0; font-family: var(--mono); font-size: 21px; font-weight: 600; color: #F2F3F5; word-break: break-word; }
.nd-file { font-family: var(--mono); font-size: 12px; word-break: break-all; }
ul.changes { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; color: #D3D7DE; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface-2); }
.kv dt { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
.kv dd { margin: 0; color: var(--text-2); line-height: 1.45; min-width: 0; }
.sig { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.sig div { display: flex; gap: 10px; padding: 7px 10px; }
.sig .b { background: var(--del-bg); } .sig .b span:first-child { color: var(--del); }
.sig .a { background: var(--add-bg); } .sig .a span:first-child { color: var(--add); }
.sig span:first-child { flex: none; width: 44px; }
.sig .b span:last-child { color: var(--del-fg); white-space: pre-wrap; word-break: break-word; }
.sig .a span:last-child { color: var(--add-fg); white-space: pre-wrap; word-break: break-word; }
.code { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow-x: auto; padding: 6px 0; font-family: var(--mono); font-size: 11.3px; line-height: 1.6; }
.code .ln { display: flex; min-width: max-content; padding-right: 12px; }
.code .sg { flex: none; width: 22px; text-align: center; user-select: none; }
.code .tx { white-space: pre; }
.code .ln.add { background: var(--add-bg); } .code .ln.add .sg { color: var(--add); } .code .ln.add .tx { color: var(--add-fg); }
.code .ln.del { background: var(--del-bg); } .code .ln.del .sg { color: var(--del); } .code .ln.del .tx { color: var(--del-fg); }
.code .ln.ctx .tx { color: #AEB4BF; } .code .ln.ctx .sg { color: #4A515E; }
.code .ln.hunk { background: var(--hunk-bg); margin: 4px 0; } .code .ln.hunk .tx { color: var(--hunk-fg); font-style: italic; }
.shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.shot { margin: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.shot.wide { grid-column: 1 / -1; }
.shot button { padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; cursor: zoom-in; display: block; width: 100%; position: relative; }
.shot img { display: block; width: 100%; height: 170px; object-fit: cover; object-position: top left; }
.shot.wide img { height: auto; max-height: 320px; }
.shot .side { position: absolute; left: 6px; top: 6px; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; }
.side.before { background: #3A1C1A; color: #F5877C; } .side.after { background: #173826; color: #5FD39B; }
.shot figcaption { font-size: 11.8px; line-height: 1.45; color: var(--muted); }
.shot figcaption b { color: var(--text-2); font-weight: 600; }
.calls { display: flex; flex-direction: column; gap: 4px; }
.calls button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; text-align: left; width: 100%; }
.calls button:hover { background: var(--hover); }

      (n.file ? '<a class="nd-file" href="' + BLOB + n.file + (n.line ? "#L" + n.line : "") + '">' + esc(n.file) + (n.line ? ":" + n.line : "") + ' ↗</a>' : "") + '</div>';
    if (n.summary) html += '<p>' + esc(n.summary) + '</p>';
    if (n.findings.length) html += '<div class="stack"><h3>Findings here</h3><div class="stack" style="gap:6px">' + n.findings.map(function (id) { var fd = FIND_BY_ID[id]; return '<div class="row-btn" style="cursor:default">' + sevPill(fd) + '<span class="f-body"><span class="f-title">' + esc(fd.title) + '</span><span class="f-text">' + esc(fd.text) + '</span></span></div>'; }).join("") + '</div></div>';
    if (n.images && n.images.length) html += '<div class="stack"><h3>In the app</h3><div class="shots">' + n.images.map(function (img, i) {
      return '<figure class="shot' + (img.wide ? " wide" : "") + '"><button type="button" data-shot="' + i + '" aria-label="Open screenshot"><img src="' + esc(img.src) + '" alt="" loading="lazy"><span class="side ' + (img.side === "before" ? "before" : "after") + '">' + (img.side === "before" ? "before · base" : "after · head") + '</span></button><figcaption>' + (img.cap || "") + '</figcaption></figure>';
    }).join("") + '</div></div>';
    if (n.sig) html += '<div class="stack"><h3>Signature &middot; interface</h3><div class="sig"><div class="b"><span>before</span><span>' + esc(n.sig[0]) + '</span></div><div class="a"><span>after</span><span>' + esc(n.sig[1]) + '</span></div></div></div>';
    if (n.facts && n.facts.length) html += '<div class="stack"><h3>' + esc(n.factsTitle || "Key facts") + '</h3><dl class="kv">' + n.facts.map(function (s) { return '<dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd>'; }).join("") + '</dl></div>';
    if (n.changes && n.changes.length) html += '<div class="stack"><h3>What changed</h3><ul class="changes">' + n.changes.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join("") + '</ul></div>';
    if (n.code) html += '<div class="stack"><h3>' + esc(n.codeTitle || "Code") + '</h3>' + codeBlock(n.code) + '</div>';
    html += '<div class="stack"><h3>Depends on &middot; downstream</h3>' + relRows(out, "out") + '</div>';
    html += '<div class="stack"><h3>Used by &middot; upstream</h3>' + relRows(inc, "in") + '</div>';
    if (idx >= 0) html += '<div class="review-row"><button type="button" class="review-btn" id="toggle-review" aria-pressed="' + (!!S.reviewed[n.id]) + '"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg>' + (S.reviewed[n.id] ? "Reviewed &middot; undo" : "Mark as reviewed") + ' <kbd>R</kbd></button><button type="button" class="next-btn" id="next-unreviewed">Next unreviewed <kbd>E</kbd></button></div>';
    rail.innerHTML = html;
    $("go-back").addEventListener("click", clearSel);
    var tr = $("toggle-review"); if (tr) tr.addEventListener("click", function () { toggleReviewed(n.id); });
    var nx = $("next-unreviewed"); if (nx) nx.addEventListener("click", goNextUnreviewed);
    Array.prototype.forEach.call(rail.querySelectorAll("[data-shot]"), function (btn) { btn.addEventListener("click", function () { openLightbox(n.images, +btn.dataset.shot); }); });
  }

  function renderEdge(e) {
    var a = NODE[e.from], b = NODE[e.to], col = edgeColor(e), ek = EK[e.kind] || EK.unchanged, r = REL[e.rel] || REL.call;
    var html = '<div>' + BACK + '</div>';
    html += '<div class="stack" style="gap:10px"><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip" style="background:#1C2028;color:' + col + '">' + esc(ek.label) + '</span><span class="chip" style="background:#232831;color:#C9CED6">' + esc(r.label) + '</span></div>' +
      '<div class="stack" style="gap:4px;font-family:var(--mono)"><span style="font-size:15px;font-weight:600;color:#F2F3F5;word-break:break-word">' + esc(a.name) + '</span>' +
      '<span style="display:flex;align-items:center;gap:6px;color:' + col + ';font-size:12px"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8"><path d="M8 2 V14 M3.5 9.5 L8 14 L12.5 9.5"/></svg>' + esc(r.verb + (e.label ? " · " + e.label : "")) + '</span>' +
      '<span style="font-size:15px;font-weight:600;color:#F2F3F5;word-break:break-word">' + esc(b.name) + '</span></div></div>';
    html += '<p>' + esc(e.detail || (e.kind === "context" ? "Relationship inside the context code, shown so the changed code's dependencies are visible." : "Unchanged relationship, shown for context.")) + '</p>';
    if (e.code) html += '<div class="stack"><h3>Call site</h3>' + codeBlock(e.code) + '</div>';
    html += '<div class="grid2"><button type="button" data-go="' + esc(a.id) + '">Open ' + esc(a.name) + '</button><button type="button" data-go="' + esc(b.id) + '">Open ' + esc(b.name) + '</button></div>';
    rail.innerHTML = html;
    $("go-back").addEventListener("click", clearSel);
  }

  function renderRail() {
    if (S.sel && S.sel.type === "node") renderNode(NODE[S.sel.id]);
    else if (S.sel && S.sel.type === "edge") renderEdge(EDGES.find(function (x) { return x.id === S.sel.id; }));
    else renderOverview();
    Array.prototype.forEach.call(rail.querySelectorAll("[data-go]"), function (btn) { btn.addEventListener("click", function () { selectNode(btn.dataset.go, true); }); });
    Array.prototype.forEach.call(rail.querySelectorAll(".calls [data-edge]"), function (btn) { btn.addEventListener("click", function () { selectEdge(btn.dataset.edge); }); });
  }

  // ---------- toolbar + chrome ----------
  function renderToolbar() {
    var modes = [{ id: "diff", label: "Diff", title: "Base and head overlaid, changes highlighted" }, { id: "before", label: "Before", title: "The graph on the base branch" }, { id: "after", label: "After", title: "The graph at this PR's head" }];
    $("modes").innerHTML = modes.map(function (m) { return '<button type="button" data-mode="' + m.id + '" title="' + m.title + '" aria-pressed="' + (S.mode === m.id) + '">' + m.label + '</button>'; }).join("");
    $("rels").innerHTML = USED_GROUPS.map(function (g) {
      var sample = REL[Object.keys(REL).filter(function (r) { return REL[r].group === g; })[0]];
      return '<button type="button" data-rel="' + g + '" aria-pressed="' + S.rels[g] + '"><svg class="sw" viewBox="0 0 18 6" aria-hidden="true"><path d="M1 3 H17" stroke="' + (S.rels[g] ? "#C9CED6" : "#5A6170") + '" stroke-width="2" stroke-dasharray="' + sample.dash + '" stroke-linecap="round" fill="none"/></svg>' + GROUP_LABEL[g] + '</button>';
    }).join("");
    Array.prototype.forEach.call($("modes").children, function (b) { b.addEventListener("click", function () { S.mode = b.dataset.mode; renderAll(); }); });
    Array.prototype.forEach.call($("rels").children, function (b) { b.addEventListener("click", function () { S.rels[b.dataset.rel] = !S.rels[b.dataset.rel]; renderAll(); }); });
    $("t-findings").hidden = !FINDINGS.length;
    $("t-findings").setAttribute("aria-pressed", S.findings);
    $("t-labels").setAttribute("aria-pressed", S.labels);
    $("t-untouched").setAttribute("aria-pressed", S.hideUntouched);
    var note = $("mode-note"), notes = D.modeNotes || {};
    if (S.mode !== "diff" && notes[S.mode]) { note.hidden = false; note.textContent = notes[S.mode]; } else note.hidden = true;
  }
  function renderChrome() {
    mainEl.classList.toggle("drawer-open", S.drawer);
    appEl.classList.toggle("full", S.full);
    $("legend").hidden = !S.legend;
    $("z-legend").setAttribute("aria-pressed", S.legend);
    $("z-full").setAttribute("aria-pressed", S.full);
    $("z-full-text").textContent = S.full ? "Exit full view" : "Full view";
    $("t-panel").setAttribute("aria-pressed", S.drawer);
    var selEdge = S.sel && S.sel.type === "edge" ? EDGES.find(function (x) { return x.id === S.sel.id; }) : null;
    $("rail-ttl").textContent = !S.sel ? "Review panel · overview" : S.sel.type === "node" ? "Node · " + NODE[S.sel.id].type : "Edge · " + (REL[selEdge.rel] || REL.call).label;
    var rr = $("rail-review"), selId = S.sel && S.sel.type === "node" ? S.sel.id : null;
    rr.hidden = !selId || ORDER.indexOf(selId) < 0;
    if (!rr.hidden) { rr.innerHTML = (S.reviewed[selId] ? "✓ Reviewed" : "Mark reviewed") + " <kbd>R</kbd>"; rr.style.color = S.reviewed[selId] ? "#7BDCAB" : "var(--accent)"; }
    var rc = ORDER.filter(function (id) { return S.reviewed[id]; }).length;
    $("rev-text").textContent = "Reviewed " + rc + " of " + ORDER.length;
    $("rev-bar").style.width = (ORDER.length ? Math.round(rc / ORDER.length * 100) : 0) + "%";
  }
  function renderAll() { renderChrome(); renderToolbar(); renderGraph(); renderRail(); }

  $("t-findings").addEventListener("click", function () { S.findings = !S.findings; renderAll(); });
  $("t-labels").addEventListener("click", toggleLabels);
  $("t-untouched").addEventListener("click", toggleUntouched);
  $("t-panel").addEventListener("click", togglePanel);
  $("rail-close").addEventListener("click", closeDrawer);
  $("rail-review").addEventListener("click", function () { if (S.sel && S.sel.type === "node") toggleReviewed(S.sel.id); });
  $("rail-next").addEventListener("click", goNextUnreviewed);
  $("z-in").addEventListener("click", function () { var r = vp.getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); });
  $("z-out").addEventListener("click", function () { var r = vp.getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); });
  $("z-reset").addEventListener("click", function () { var r = vp.getBoundingClientRect(); zoomAt(1 / S.zoom, r.width / 2, r.height / 2); });
  $("z-fit").addEventListener("click", function () { fit(true); });
  $("z-layout").addEventListener("click", function () { NODES.forEach(function (n) { n.x = n.x0; n.y = n.y0; }); renderGraph(); });
  $("z-legend").addEventListener("click", toggleLegend);
  $("z-full").addEventListener("click", toggleFull);

  // ---------- lightbox ----------
  var lb = $("lightbox"), lbSet = [], lbIdx = 0;
  function openLightbox(set, i) { lbSet = set; lbIdx = i; showLb(); lb.hidden = false; $("lb-close").focus(); }
  function showLb() { var it = lbSet[lbIdx]; $("lb-img").src = it.src; $("lb-cap").innerHTML = (it.side === "before" ? "Before · base — " : "After · head — ") + (it.cap || "") + ' <span style="color:var(--faint)">(' + (lbIdx + 1) + "/" + lbSet.length + ")</span>"; }
  function closeLb() { lb.hidden = true; }
  $("lb-close").addEventListener("click", closeLb);
  $("lb-prev").addEventListener("click", function () { lbIdx = (lbIdx - 1 + lbSet.length) % lbSet.length; showLb(); });
  $("lb-next").addEventListener("click", function () { lbIdx = (lbIdx + 1) % lbSet.length; showLb(); });
  lb.addEventListener("click", function (ev) { if (ev.target === lb) closeLb(); });

  // ---------- keys (left hand: R E A D X C, plus F L P) ----------
  document.addEventListener("keydown", function (ev) {
    if (!lb.hidden) {
      if (ev.key === "Escape") closeLb(); else if (ev.key === "ArrowLeft") $("lb-prev").click(); else if (ev.key === "ArrowRight") $("lb-next").click();
      return;
    }
    if (ev.key === "Escape") { if (S.drawer) closeDrawer(); else if (S.full) toggleFull(); return; }
    var tag = (ev.target && ev.target.tagName) || "";
    if (ev.metaKey || ev.ctrlKey || ev.altKey || tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    var k = ev.key.toLowerCase();
    if (k === "f") toggleFull();
    else if (k === "l") toggleLegend();
    else if (k === "p") togglePanel();
    else if (k === "x") toggleUntouched();
    else if (k === "c") toggleLabels();
    else if (k === "e") goNextUnreviewed();
    else if (k === "a" && ORDER.length) selectNode(stepChanged(-1), true);
    else if (k === "d" && ORDER.length) selectNode(stepChanged(1), true);
    else if (k === "r" && S.sel && S.sel.type === "node") toggleReviewed(S.sel.id);
  });

  // ---------- boot ----------
  renderLegend();
  renderAll();
  // A #node link opens that node after the first fit, so the fit can't zoom back out over it.
  var h = (location.hash || "").replace("#", "");
  requestAnimationFrame(function () { fit(false); if (h && NODE[h]) selectNode(h, true); });
})();
</script>
